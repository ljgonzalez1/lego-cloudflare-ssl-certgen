name: CI/CD
permissions:
  contents: read
concurrency:
  group: "${{ github.event_name == 'release' && 'certgen-dockerhub-publication' ||\n    format('certgen-ci-{0}', github.run_id) }}"
  queue: max
env:
  TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}

jobs:
  static_go:
    name: Go / Golang static code analysis
    if: ${{ github.event.deleted != true }}
    continue-on-error: ${{ github.event_name != 'pull_request' || github.base_ref != 'master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Install static analysis dependencies
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 python3-yaml jq shellcheck gawk
    - name: Set up pinned Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.27.4
        cache: false
    - name: Analyze Go / Golang
      run: python3 -B ci/analyze.py go
    - name: Report advisory static failure
      if: ${{ always() && failure() && (github.event_name != 'pull_request' || github.base_ref != 'master') }}
      run: 'printf ''::warning::Static analysis failed; this event treats it as advisory. Functional checks remain required.\n''

        printf ''### Static analysis warning\n\nInspect this job for diagnostics. Functional checks remain required.\n'' >> "$GITHUB_STEP_SUMMARY"'
  static_python:
    name: Python static code analysis
    if: ${{ github.event.deleted != true }}
    continue-on-error: ${{ github.event_name != 'pull_request' || github.base_ref != 'master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7.0.1
