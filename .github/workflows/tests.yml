name: Tests

on:
  push:
    branches:
      - master
      - '[vV][0-9]+.[0-9]*'
      - '[0-9]+.[0-9]*'
      - '[vV][0-9]+.[0-9]*/**'
      - '[0-9]+.[0-9]*/**'
  pull_request:
    branches:
      - master
      - '[vV][0-9]+.[0-9]*'
      - '[0-9]+.[0-9]*'
      - '[vV][0-9]+.[0-9]*/**'
      - '[0-9]+.[0-9]*/**'
  workflow_call:

permissions:
  contents: read

jobs:
  classify_branch:
    name: Check version branch name
    if: >-
      ${{ github.event_name != 'release' && github.event.deleted != true &&
          (github.base_ref || github.ref_name) != 'master' }}
    runs-on: ubuntu-24.04
    outputs:
      eligible: ${{ steps.match.outputs.eligible }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Match the version branch format
        id: match
        shell: bash
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          case "$BRANCH" in
            '') exit 1 ;;
          esac
          if bash ci/is-version-branch.sh "$BRANCH"; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          fi

  version_docs:
    name: Check version in ${{ matrix.document }}
    needs: classify_branch
    if: >-
      ${{ !cancelled() && github.event.deleted != true &&
          (github.event_name == 'release' || (github.base_ref || github.ref_name) == 'master' ||
           needs.classify_branch.outputs.eligible == 'true') }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        document: [DOCKERHUB.md, README.md]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify the committed Docker tag table
        env:
          DOCUMENT: ${{ matrix.document }}
          VERSION_REF: >-
            ${{ github.event.release.tag_name ||
                (github.base_ref == 'master' && github.head_ref) || github.base_ref || github.ref_name }}
        run: python3 -B versions/check_version.py "$DOCUMENT" --ref "$VERSION_REF"

  offline:
    name: Offline tests
    needs: version_docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ libyaml-dev
      - name: Run offline tests
        run: sh tests/run.sh

  smoke:
    name: Smoke test (${{ matrix.platform }})
    needs: offline
    if: github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/arm/v6, linux/arm/v7, linux/arm64, linux/386, linux/amd64]
    uses: ./.github/workflows/smoke.yml
    with:
      platform: ${{ matrix.platform }}
