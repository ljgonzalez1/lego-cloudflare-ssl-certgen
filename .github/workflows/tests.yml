name: Tests

on:
  push:
    branches:
      - master
      - '[vV][0-9]+.[0-9]*'
      - '[0-9]+.[0-9]*'

permissions:
  contents: read

jobs:
  classify_branch:
    name: Check branch name
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.match.outputs.eligible }}
    steps:
      - name: Match the version branch format
        id: match
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          version='[vV]?[0-9]+(\.[0-9]+){1,3}'
          suffix='[.-](build|audit|review|beta|alpha)([.-][0-9]+(\.[0-9]+){0,4})?'
          if [[ "$BRANCH" == master || "$BRANCH" =~ ^${version}(${suffix})?$ ]]; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          else
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
          fi

  offline:
    needs: classify_branch
    if: needs.classify_branch.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ libyaml-dev
      - name: Run offline tests
        run: sh tests/run.sh

  smoke_armv6:
    if: github.ref == 'refs/heads/master' && github.event.deleted == false
    uses: ./.github/workflows/smoke.yml
    with:
      platform: linux/arm/v6

  smoke_armv7:
    needs: smoke_armv6
    uses: ./.github/workflows/smoke.yml
    with:
      platform: linux/arm/v7

  smoke_arm64:
    needs: smoke_armv7
    uses: ./.github/workflows/smoke.yml
    with:
      platform: linux/arm64

  smoke_x86:
    needs: smoke_arm64
    uses: ./.github/workflows/smoke.yml
    with:
      platform: linux/386

  smoke_amd64:
    needs: smoke_x86
    uses: ./.github/workflows/smoke.yml
    with:
      platform: linux/amd64
