      && (needs.static_actions.result == 'success' || ((github.event_name != 'pull_request' || github.base_ref != 'master') && needs.static_actions.result
      == 'failure')) && (needs.static_csv.result == 'success' || ((github.event_name != 'pull_request' || github.base_ref != 'master')
      && needs.static_csv.result == 'failure')) && (needs.static_json.result == 'success' || ((github.event_name != 'pull_request' ||
      github.base_ref != 'master') && needs.static_json.result == 'failure')) && (needs.static_modules.result == 'success' || ((github.event_name
      != 'pull_request' || github.base_ref != 'master') && needs.static_modules.result == 'failure')) && (needs.static_formats.result
      == 'success' || ((github.event_name != 'pull_request' || github.base_ref != 'master') && needs.static_formats.result == 'failure'))
      && (needs.version_readme.result == 'success' && needs.version_dockerhub.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Install native race-detector dependencies
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc python3
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.27.4
        cache: false
    - name: Run shuffled Go unit tests with full debug information and coverage
      working-directory: build
      env:
        CGO_ENABLED: '0'
      run: go test -buildvcs=false -mod=vendor -shuffle=on -count=1 -timeout=5m -gcflags='all=-N -l -d=checkptr=2' -ldflags='-compressdwarf=false'
        -coverprofile=coverage.out ./...
    - name: Check races with pointer checks on native AMD64
      working-directory: build
      env:
        CGO_ENABLED: '1'
      run: go test -race -buildvcs=false -mod=vendor -shuffle=on -count=1 -timeout=5m -gcflags='all=-N -l -d=checkptr=2' -ldflags='-compressdwarf=false'
        ./...
    - name: Fuzz argument parsing, YAML and lego logs offline
      working-directory: build
      env:
        CGO_ENABLED: '0'
      run: "for target in FuzzParseOptions FuzzLoadDomains FuzzLegoLog; do\n  go test -buildvcs=false -mod=vendor -run='^$' -fuzz=\"\
        ^${target}$\" \\\n    -fuzztime=15s -parallel=2 -timeout=2m \\\n    -gcflags='all=-N -l -d=checkptr=2' -ldflags='-compressdwarf=false'\
        \ ./internal/certgen\ndone\n"
    - name: Test real Go binaries, logs, dumps and five debug ELF targets
      run: python3 -B ci/test_go_binary.py
  smoke_armv6:
    name: ARMv6 smoke test
    needs:
    - offline
    - go_tests
    if: ${{ github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name
      == 'pull_request' && github.base_ref == 'master') }}
    uses: ./.github/workflows/smoke.yml
    with:
      platform: linux/arm/v6
  smoke_armv7:
    name: ARMv7 smoke test
    needs:
    - offline
    - go_tests
    if: ${{ github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name
      == 'pull_request' && github.base_ref == 'master') }}
    uses: ./.github/workflows/smoke.yml
    with:
      platform: linux/arm/v7
  smoke_arm64:
    name: ARM64 smoke test
    needs:
    - offline
    - go_tests
    if: ${{ github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name
      == 'pull_request' && github.base_ref == 'master') }}
    uses: ./.github/workflows/smoke.yml
    with:
      platform: linux/arm64
  smoke_i386:
    name: i386 smoke test
    needs:
    - offline
    - go_tests
    if: ${{ github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name
      == 'pull_request' && github.base_ref == 'master') }}
    uses: ./.github/workflows/smoke.yml
    with:
      platform: linux/386
  smoke_amd64:
    name: AMD64 smoke test
    needs:
    - offline
    - go_tests
    if: ${{ github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name
      == 'pull_request' && github.base_ref == 'master') }}
    uses: ./.github/workflows/smoke.yml
    with:
      platform: linux/amd64
  publish:
    name: Buildx and push to Docker Hub
    if: github.event_name == 'release'
    needs:
    - smoke_armv6
    - smoke_armv7
    - smoke_arm64
    - smoke_i386
    - smoke_amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      digest_armv6: ${{ steps.push.outputs.digest_armv6 }}
      digest_armv7: ${{ steps.push.outputs.digest_armv7 }}
      digest_arm64: ${{ steps.push.outputs.digest_arm64 }}
      digest_i386: ${{ steps.push.outputs.digest_i386 }}
      digest_amd64: ${{ steps.push.outputs.digest_amd64 }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Check that Docker Hub credentials are configured
      shell: bash
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_PUSH_TOKEN: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}
        DOCKERHUB_DESCRIPTION_TOKEN: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
      run: ': "${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}"

        : "${DOCKERHUB_PUSH_TOKEN:?Set DOCKERHUB_PUSH_TOKEN}"

        : "${DOCKERHUB_DESCRIPTION_TOKEN:?Set DOCKERHUB_DESCRIPTION_TOKEN}"

        '
    - name: Build and publish all five platforms
      id: push
      shell: bash
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_PUSH_TOKEN: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: 'result="$RUNNER_TEMP/certgen-publish.json"

        PUBLISH_RESULT_FILE="$result" bash ci/publish-image.sh

        bash ci/read-publish-result.sh "$result" > "$RUNNER_TEMP/certgen-outputs"

        cat "$RUNNER_TEMP/certgen-outputs" >> "$GITHUB_OUTPUT"

        printf ''Exported the index hash and all five platform hashes.\n''

        '
  update_description:
    name: Update Docker Hub overview
    needs: publish
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Update the Docker Hub overview
      uses: peter-evans/dockerhub-description@v5
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
        repository: ljgonzalez/lego-cloudflare-certgen
        readme-filepath: ./DOCKERHUB.md
  wait_image:
    name: 'Test: wait 20 seconds for image propagation'
    needs: publish
    runs-on: ubuntu-24.04
    steps:
    - name: Wait for image propagation
      run: 'sleep 20

        echo Done waiting

        true

        '
  verify_image:
    name: Verify published version tag
    needs: wait_image
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Find a full-version tag from the final CSV row
      id: tag
      run: bash ci/check-dockerhub.sh tag
  verify_hashes:
    name: Compare SHA-256 (${{ matrix.platform }})
    needs:
    - publish
    - verify_image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux/arm/v6
          output: digest_armv6
        - platform: linux/arm/v7
          output: digest_armv7
        - platform: linux/arm64
          output: digest_arm64
        - platform: linux/386
          output: digest_i386
        - platform: linux/amd64
          output: digest_amd64
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Compare Buildx hash with Docker Hub
      env:
        PLATFORM: ${{ matrix.platform }}
        TAG: ${{ needs.verify_image.outputs.tag }}
        EXPECTED_DIGEST: ${{ needs.publish.outputs[matrix.output] }}
        INDEX_DIGEST: ${{ needs.publish.outputs.digest }}
      run: bash ci/check-dockerhub.sh platform "$PLATFORM" "$TAG" "$EXPECTED_DIGEST" "$INDEX_DIGEST"
  wait_description:
    name: 'Test: wait 20 seconds for description propagation'
    needs: update_description
    runs-on: ubuntu-24.04
    steps:
    - name: Wait for description propagation
      run: 'sleep 20

        echo Done waiting

        true

        '
  verify_description:
    name: Verify published Docker Hub overview
    needs: wait_description
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Compare Docker Hub Markdown
      run: bash ci/check-dockerhub.sh description
"on":
  push:
    branches:
    - master
    - '[vV][0-9]*.[0-9]*'
    - '[0-9]*.[0-9]*'
  pull_request:
    branches:
    - master
    - '[vV][0-9]*.[0-9]*'
    - '[0-9]*.[0-9]*'
  release:
    types:
    - published
