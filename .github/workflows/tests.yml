name: CI/CD

on:
  push:
    branches:
      - master
      - '[vV][0-9]+.[0-9]*'
      - '[0-9]+.[0-9]*'
      - '[vV][0-9]+.[0-9]*/**'
      - '[0-9]+.[0-9]*/**'
  pull_request:
    branches:
      - master
      - '[vV][0-9]+.[0-9]*'
      - '[0-9]+.[0-9]*'
      - '[vV][0-9]+.[0-9]*/**'
      - '[0-9]+.[0-9]*/**'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'release' && 'certgen-dockerhub-publication' ||
        format('certgen-ci-{0}', github.run_id) }}
  queue: max

env:
  TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
  VERSION_REF: >-
    ${{ github.event.release.tag_name ||
        (github.base_ref == 'master' && github.head_ref) || github.base_ref || github.ref_name }}

jobs:
  version_readme:
    name: Check version in README.md
    if: >-
      ${{ github.event.deleted != true &&
          (github.event_name != 'push' || github.ref == 'refs/heads/master' ||
           github.event.created != true || github.event.commits[0] != null) }}
    runs-on: ubuntu-24.04
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify the committed Docker tag table
        id: check
        run: bash ci/check-version.sh README.md

  version_dockerhub:
    name: Check version in DOCKERHUB.md
    if: >-
      ${{ github.event.deleted != true &&
          (github.event_name != 'push' || github.ref == 'refs/heads/master' ||
           github.event.created != true || github.event.commits[0] != null) }}
    runs-on: ubuntu-24.04
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify the committed Docker tag table
        id: check
        run: bash ci/check-version.sh DOCKERHUB.md

  offline:
    name: Offline tests
    needs: [version_readme, version_dockerhub]
    if: >-
      ${{ needs.version_readme.outputs.eligible == 'true' &&
          needs.version_dockerhub.outputs.eligible == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ libyaml-dev python3 python3-yaml jq
      - name: Run offline tests
        run: sh tests/run.sh
      - name: Test Docker Hub verification logic
        run: bash ci/test-dockerhub.sh
      - name: Test Buildx metadata, platform hashes and release tag configuration
        run: python3 -B ci/test_publish.py
      - name: Test CI event routing and job dependencies
        run: python3 -B ci/test_workflows.py

  smoke_armv6:
    name: ARMv6 smoke test
    needs: offline
    if: >-
      ${{ github.event_name == 'release' || github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    uses: ./.github/workflows/smoke.yml
    with:
      platform: linux/arm/v6

  smoke_armv7:
    name: ARMv7 smoke test
    needs: offline
    if: >-
      ${{ github.event_name == 'release' || github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    uses: ./.github/workflows/smoke.yml
    with:
      platform: linux/arm/v7

  smoke_arm64:
    name: ARM64 smoke test
    needs: offline
    if: >-
      ${{ github.event_name == 'release' || github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    uses: ./.github/workflows/smoke.yml
    with:
      platform: linux/arm64

  smoke_i386:
    name: i386 smoke test
    needs: offline
    if: >-
      ${{ github.event_name == 'release' || github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    uses: ./.github/workflows/smoke.yml
    with:
      platform: linux/386

  smoke_amd64:
    name: AMD64 smoke test
    needs: offline
    if: >-
      ${{ github.event_name == 'release' || github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    uses: ./.github/workflows/smoke.yml
    with:
      platform: linux/amd64

  publish:
    name: Buildx and push to Docker Hub
    if: github.event_name == 'release'
    needs: [smoke_armv6, smoke_armv7, smoke_arm64, smoke_i386, smoke_amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      digest_armv6: ${{ steps.push.outputs.digest_armv6 }}
      digest_armv7: ${{ steps.push.outputs.digest_armv7 }}
      digest_arm64: ${{ steps.push.outputs.digest_arm64 }}
      digest_i386: ${{ steps.push.outputs.digest_i386 }}
      digest_amd64: ${{ steps.push.outputs.digest_amd64 }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check that Docker Hub credentials are configured
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PUSH_TOKEN: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}
          DOCKERHUB_DESCRIPTION_TOKEN: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
        run: |
          : "${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}"
          : "${DOCKERHUB_PUSH_TOKEN:?Set DOCKERHUB_PUSH_TOKEN}"
          : "${DOCKERHUB_DESCRIPTION_TOKEN:?Set DOCKERHUB_DESCRIPTION_TOKEN}"

      - name: Build and publish all five platforms
        id: push
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PUSH_TOKEN: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}
        run: |
          result="$RUNNER_TEMP/certgen-publish.json"
          PUBLISH_RESULT_FILE="$result" bash ci/publish-image.sh
          bash ci/read-publish-result.sh "$result" > "$RUNNER_TEMP/certgen-outputs"
          cat "$RUNNER_TEMP/certgen-outputs" >> "$GITHUB_OUTPUT"
          printf 'Exported the index hash and all five platform hashes.\n'

  update_description:
    name: Update Docker Hub overview
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Update the Docker Hub overview
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
          repository: ljgonzalez/lego-cloudflare-certgen
          readme-filepath: ./DOCKERHUB.md

  wait_image:
    name: "Test: wait 20 seconds for image propagation"
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for image propagation
        run: |
          sleep 20
          echo Done waiting
          true

  verify_image:
    name: Verify published version tag
    needs: wait_image
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Find a full-version tag from the final CSV row
        id: tag
        run: bash ci/check-dockerhub.sh tag

  verify_hashes:
    name: Compare SHA-256 (${{ matrix.platform }})
    needs: [publish, verify_image]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm/v6
            output: digest_armv6
          - platform: linux/arm/v7
            output: digest_armv7
          - platform: linux/arm64
            output: digest_arm64
          - platform: linux/386
            output: digest_i386
          - platform: linux/amd64
            output: digest_amd64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compare Buildx hash with Docker Hub
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ needs.verify_image.outputs.tag }}
          EXPECTED_DIGEST: ${{ needs.publish.outputs[matrix.output] }}
          INDEX_DIGEST: ${{ needs.publish.outputs.digest }}
        run: bash ci/check-dockerhub.sh platform "$PLATFORM" "$TAG" "$EXPECTED_DIGEST" "$INDEX_DIGEST"

  wait_description:
    name: "Test: wait 20 seconds for description propagation"
    needs: update_description
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for description propagation
        run: |
          sleep 20
          echo Done waiting
          true

  verify_description:
    name: Verify published Docker Hub overview
    needs: wait_description
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compare Docker Hub Markdown
        run: bash ci/check-dockerhub.sh description
