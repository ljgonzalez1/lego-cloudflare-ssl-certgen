name: Update local badges
permissions:
  actions: read
  contents: write
concurrency:
  group: certgen-local-badges
  cancel-in-progress: false
jobs:
  update:
    if: ${{ (github.event_name != 'workflow_run' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name
      == github.repository && ((github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master') || github.event.workflow_run.event
      == 'release')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
    - name: Check out trusted master code only
      uses: actions/checkout@v7.0.1
      with:
        ref: master
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Update self-contained SVG snapshots atomically
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python3 -B ci/badges.py --github
'on':
  workflow_run:
    workflows:
    - CI/CD
    types:
    - requested
    - in_progress
    - completed
  workflow_dispatch: null
  schedule:
  - cron: 23 * * * *
