# Issue one certificate per selected group and exit.
# Set CLOUDFLARE_API_TOKEN and container settings in .env.
# Run docker compose run --rm certgen from this directory.

name: lego-cloudflare-certgen

services:
  certgen:
    image: "${CERTGEN_IMAGE:-ljgonzalez/lego-cloudflare-certgen:v4.2.11}"

    env_file:
      - "${CERTGEN_ENV_FILE:-./.env}"
    # Supply the canonical token through the Compose secret.
    environment:
      CLOUDFLARE_API_TOKEN: ""

    volumes:
      # One top-level YAML key per certificate and output directory.
      - type: bind
        source: "${DOMAINS_FILE:-./domains.yaml}"
        target: /app/domains.yaml
        read_only: true
        bind:
          create_host_path: false

      # Issued certificates and ACME account data.
      - ./ssl-certs:/ssl-certs

    secrets:
      - cloudflare_api_token

    # One-shot: do not restart after the container exits.
    restart: "no"

    # CHOWN prepares the output volume. SETUID/SETGID let su-exec drop privileges.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

# Compose resolves the secret from the host environment or the project's .env.
secrets:
  cloudflare_api_token:
    environment: CLOUDFLARE_API_TOKEN
