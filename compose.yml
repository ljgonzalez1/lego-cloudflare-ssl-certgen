# ==============================================================================
# compose.yml  --  lego-cloudflare-certgen
# ==============================================================================
# Generates one certificate per selected group in domains.yaml and exits.
#
# Setup
# -----
# 1. Make the tagged image available locally. See the README build command.
# 2. Set CLOUDFLARE_API_TOKEN in the project's .env file.
# 3. Copy template.env to certgen.env and fill in the issuance settings.
# 4. Review domains.yaml and create ./ssl-certs.
# 5. Run docker compose run --rm certgen.
#
# The Cloudflare token is provided as a secret file at
# /run/secrets/cloudflare_api_token and read by lego.
# ==============================================================================

name: lego-cloudflare-certgen

services:
  certgen:
    image: lego-cloudflare-certgen:lego4.34.0-2.0
    pull_policy: never

    # Container settings (e-mail, timezone, UID/GID, etc.).
    env_file:
      - ./certgen.env

    volumes:
      # One top-level YAML key per certificate and output directory.
      - type: bind
        source: "${DOMAINS_FILE:-./domains.yaml}"
        target: /app/domains.yaml
        read_only: true
        bind:
          create_host_path: false

      # Issued certificates and ACME account data.
      - ./ssl-certs:/ssl-certs

    secrets:
      - cloudflare_api_token

    # One-shot: do not restart after the container exits.
    restart: "no"

    # CHOWN prepares the output volume. SETUID/SETGID let gosu drop privileges.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

# Compose resolves the secret from the host environment or the project's .env.
secrets:
  cloudflare_api_token:
    environment: CLOUDFLARE_API_TOKEN
